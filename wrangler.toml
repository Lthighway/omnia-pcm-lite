name = "omnia-pcm-lite"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "omnia-pcm-lite"
database_id = "5aa8d8c4-89a4-4503-9fe2-ca052dda0a82"
migrations_dir = "cloudflare/migrations"

[vars]
DEMO_MODE = "false"
BILLING_MODE = "live"
SESSION_DAYS = "7"

[observability]
enabled = true
head_sampling_rate = 1
